<template>
    <template if:true={showFooter}>
        <footer class="app-footer">
            <div class="footer-content">
                <div class="footer-left">
                    <div class="footer-logo">
                        <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
                            <circle cx="20" cy="20" r="20" fill="#0f4c81"/>
                            <circle cx="20" cy="15" r="5" fill="white" opacity="0.9"/>
                            <path d="M8 32c0-6.627 5.373-12 12-12s12 5.373 12 12" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
                        </svg>
                        <span class="footer-brand">{footerData.appName}</span>
                    </div>
                    <span class="footer-version">v{footerData.appVersion}</span>
                </div>
                <div class="footer-center">
                    <div class="footer-stats">
                        <div class="stat-item">
                            <span class="stat-value">{footerData.totalEmployees}</span>
                            <span class="stat-label">Employes actifs</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">{footerData.totalDepartments}</span>
                            <span class="stat-label">Departements</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">{footerData.highRiskEmployees}</span>
                            <span class="stat-label">Risque eleve</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">{footerData.skillGapEmployees}</span>
                            <span class="stat-label">Skill gap</span>
                        </div>
                    </div>
                    <div class="footer-stats secondary">
                        <div class="stat-item">
                            <span class="stat-value">{footerData.hipaaTrainings}</span>
                            <span class="stat-label">HIPAA</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">{footerData.gdprTrainings}</span>
                            <span class="stat-label">GDPR</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">{footerData.pciTrainings}</span>
                            <span class="stat-label">PCI</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">{formattedRoi}</span>
                            <span class="stat-label">ROI moyen</span>
                        </div>
                    </div>
                    <div class="footer-tags">
                        <span class="tag critical">Critique: {footerData.criticalRiskEmployees}</span>
                        <span class="tag warning">Risque: {footerData.highRiskEmployees}</span>
                        <span class="tag info">Budget: {formattedBudget}</span>
                    </div>
                    <div class="footer-tags">
                        <span class="tag info">COPPA: {footerData.coppaTrainings}</span>
                        <span class="tag info">CCPA: {footerData.ccpaTrainings}</span>
                    </div>
                </div>
                <div class="footer-right">
                    <span class="footer-user">Connecte en tant que {footerData.userName}</span>
                    <span class="footer-org">{footerData.orgName} | {footerData.today}</span>
                    <span class="footer-org">Derniere mise a jour: {footerData.lastRefresh}</span>
                    <span class="footer-copyright">&copy; {footerData.currentYear} Smart Workforce. Tous droits reserves.</span>
                </div>
            </div>
        </footer>
    </template>
</template>
