<template>
    <div class="alerts">
        <header class="alerts-header">
            <div>
                <h2>Alertes Temps Reel</h2>
                <p>Total non traitees: {totalAlerts} • Maj: {lastRefresh}</p>
            </div>
            <div class="header-actions">
                <div class="pulse-indicator">
                    <span class="pulse-dot"></span>
                    Live
                </div>
                <button class="refresh-btn" onclick={handleManualRefresh}>Rafraichir</button>
            </div>
        </header>

        <section class="alerts-summary">
            <div class="summary-chip critical">Critique: {criticalAlerts.length}</div>
            <div class="summary-chip warning">Attention: {warningAlerts.length}</div>
            <div class="summary-chip info">Info: {infoAlerts.length}</div>
        </section>

        <section class="alert-group">
            <div class="group-title critical">CRITIQUE</div>
            <template for:each={criticalAlerts} for:item="alert">
                <div key={alert.Id} class="alert-card">
                    <div class={alert.avatarClass}>{alert.initials}</div>
                    <div class="alert-info">
                        <div class="alert-name">{alert.displayName}</div>
                        <div class="alert-reason">{alert.employeeTitle} • {alert.employeeDept}</div>
                        <div class="alert-reason">{alert.displayTitle}</div>
                    </div>
                    <button class="action-btn" data-id={alert.Id} onclick={markHandled}>Marquer traite</button>
                </div>
            </template>
        </section>

        <section class="alert-group">
            <div class="group-title warning">ATTENTION</div>
            <template for:each={warningAlerts} for:item="alert">
                <div key={alert.Id} class="alert-card">
                    <div class={alert.avatarClass}>{alert.initials}</div>
                    <div class="alert-info">
                        <div class="alert-name">{alert.displayName}</div>
                        <div class="alert-reason">{alert.employeeTitle} • {alert.employeeDept}</div>
                        <div class="alert-reason">{alert.displayTitle}</div>
                    </div>
                    <button class="action-btn" data-id={alert.Id} onclick={markHandled}>Marquer traite</button>
                </div>
            </template>
        </section>

        <section class="alert-group">
            <div class="group-title info">INFO</div>
            <template for:each={infoAlerts} for:item="alert">
                <div key={alert.Id} class="alert-card">
                    <div class={alert.avatarClass}>{alert.initials}</div>
                    <div class="alert-info">
                        <div class="alert-name">{alert.displayName}</div>
                        <div class="alert-reason">{alert.employeeTitle} • {alert.employeeDept}</div>
                        <div class="alert-reason">{alert.displayTitle}</div>
                    </div>
                    <button class="action-btn" data-id={alert.Id} onclick={markHandled}>Marquer traite</button>
                </div>
            </template>
        </section>

        <template if:true={isLoading}>
            <div class="loading-overlay">
                <div class="spinner"></div>
                <p>Chargement...</p>
            </div>
        </template>

    </div>
</template>
