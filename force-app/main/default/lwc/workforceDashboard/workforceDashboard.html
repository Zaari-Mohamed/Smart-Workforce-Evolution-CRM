<template>
    <div class="dashboard-root">

        <!-- Header -->
        <header class="dashboard-header">
            <div class="header-left">
                <div class="logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <circle cx="20" cy="20" r="20" fill="url(#logoGrad)"/>
                        <circle cx="20" cy="15" r="5" fill="white" opacity="0.9"/>
                        <path d="M8 32c0-6.627 5.373-12 12-12s12 5.373 12 12" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
                        <defs>
                            <linearGradient id="logoGrad" x1="0" y1="0" x2="40" y2="40">
                                <stop offset="0%" stop-color="#0F4C81"/>
                                <stop offset="100%" stop-color="#1D9E75"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div class="header-titles">
                    <h1 class="title">Smart Workforce</h1>
                    <span class="subtitle">Tableau de bord RH</span>
                </div>
            </div>
            <div class="header-right">
                <div class="live-badge">
                    <span class="live-dot"></span>
                    Live
                </div>
                <div class="date">{currentDate}</div>
                <div class="avatar">RH</div>
            </div>
        </header>

        <!-- KPI Cards -->
        <section class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-icon blue">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                </div>
                <div class="kpi-info">
                    <div class="kpi-value">{totalEmployees}</div>
                    <div class="kpi-label">Employés actifs</div>
                </div>
                <div class="kpi-trend up">↑ 12%</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-icon red">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                </div>
                <div class="kpi-info">
                    <div class="kpi-value">{highRiskCount}</div>
                    <div class="kpi-label">Risque critique</div>
                </div>
                <div class="kpi-trend down">↑ Attention</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-icon green">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
                        <polyline points="16 7 22 7 22 13"/>
                    </svg>
                </div>
                <div class="kpi-info">
                    <div class="kpi-value">{avgPerformance}%</div>
                    <div class="kpi-label">Performance moy.</div>
                </div>
                <div class="kpi-trend up">↑ +3pts</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-icon orange">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 8v4l3 3"/>
                    </svg>
                </div>
                <div class="kpi-info">
                    <div class="kpi-value">{avgTurnoverRisk}%</div>
                    <div class="kpi-label">Risque turnover</div>
                </div>
                <div class="kpi-trend neutral">→ Stable</div>
            </div>

            <div class="kpi-card">
                <div class="kpi-icon purple">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                </div>
                <div class="kpi-info">
                    <div class="kpi-value">{avgSkillMatch}%</div>
                    <div class="kpi-label">Skill Match</div>
                </div>
                <div class="kpi-trend up">↑ Bon</div>
            </div>
        </section>

        <!-- Search and Filters -->
        <div class="filters-bar">
            <div class="search-box">
                <svg class="search-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <lightning-input type="search" placeholder="Rechercher un employé..." onchange={handleSearch} class="search-input"></lightning-input>
            </div>
            <div class="filter-buttons">
                <button class={filterAllClass} onclick={filterAllEmployees}>Tous</button>
                <template for:each={departments} for:item="dept">
                    <button key={dept.name} class={dept.activeClass} onclick={filterByDepartment} data-dept={dept.name}>{dept.name}</button>
                </template>
            </div>
        </div>

        <!-- Employees Table -->
        <div class="table-container">
            <table class="employees-table">
                <thead>
                    <tr>
                        <th>Employé</th>
                        <th>Poste</th>
                        <th>Département</th>
                        <th>Performance</th>
                        <th>Turnover Risk</th>
                        <th>Skill Match</th>
                        <th>Statut</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={displayedEmployees} for:item="emp">
                        <tr key={emp.Id} onclick={viewEmployee} data-id={emp.Id}>
                            <td>
                                <div class="employee-cell">
                                    <div class="employee-avatar">{emp.initials}</div>
                                    <div>
                                        <div class="employee-name">{emp.Name}</div>
                                        <div class="employee-id">{emp.Employee_ID__c}</div>
                                    </div>
                                </div>
                            </td>
                            <td>{emp.Job_Title__c}</td>
                            <td><span class="dept-badge">{emp.Department__c}</span></td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill perf" style={emp.perfStyle}></div>
                                </div>
                                <span class="progress-value">{emp.Performance_Score__c}%</span>
                            </td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill" style={emp.riskStyle}></div>
                                </div>
                                <span class="progress-value">{emp.Turnover_Risk__c}%</span>
                            </td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill skill" style={emp.skillStyle}></div>
                                </div>
                                <span class="progress-value">{emp.Skill_Match_Score__c}%</span>
                            </td>
                            <td><span class={emp.statusClass}>{emp.Status__c}</span></td>
                            <td>
                                <button class="view-btn" data-id={emp.Id} onclick={viewEmployee}>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
            <template if:true={showEmpty}>
                <div class="empty-state">
                    <p>Aucun résultat trouvé</p>
                </div>
            </template>
        </div>

        <!-- Loading -->
        <template if:true={loading}>
            <div class="loading-overlay">
                <div class="spinner"></div>
                <p>Chargement...</p>
            </div>
        </template>

    </div>
</template>
